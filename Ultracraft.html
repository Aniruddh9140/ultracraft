<!DOCTYPE html>
<html lang="en">
<head>
<!--
  Ultracraft - single-file build.

  Generated by tools/bundle.js from 33 ES modules.
  Everything (game, renderer, texture generators, worker) is inlined below:
  no imports, no network, no server. Double-click this file to play.

  Source: https://github.com/Aniruddh9140/ultracraft
-->

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<meta name="description" content="Ultracraft - a free, open-source voxel sandbox with AAA rendering that runs on low-end devices." />
<title>Ultracraft</title>
<style>
/* ==========================================================================
   Ultracraft - interface styles
   Everything is driven by CSS custom properties so the theme can be swapped
   (and so the touch layout can grow the hit targets) in one place.
   ========================================================================== */

:root {
  --bg: #0b0f14;
  --panel: rgba(18, 22, 28, 0.94);
  --panel-solid: #161b22;
  --border: #2c3644;
  --border-light: #3d4b5c;
  --text: #e6edf3;
  --text-dim: #9aa7b4;
  --accent: #7ce38b;
  --accent-dim: #4c9a5c;
  --danger: #e2564c;
  --xp: #7ce38b;
  --slot: rgba(255, 255, 255, 0.05);
  --slot-hover: rgba(255, 255, 255, 0.12);
  --slot-size: 40px;
  --icon: 32px;
  --radius: 6px;
  --font: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

#app { position: fixed; inset: 0; }

#glcanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: crosshair;
  image-rendering: pixelated;
}

.hidden { display: none !important; }

/* ==========================================================================
   HUD
   ========================================================================== */
#hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
}
#hud.no-hud > *:not(#crosshair):not(#chat-wrap) { opacity: 0; }

#crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 20px;
  height: 20px;
  transform: translate(-50%, -50%);
  mix-blend-mode: difference;
}
#crosshair .ch {
  position: absolute;
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 0 2px rgba(0, 0, 0, 0.9);
}
#crosshair .ch-h { left: 0; top: 9px; width: 20px; height: 2px; }
#crosshair .ch-v { left: 9px; top: 0; width: 2px; height: 20px; }

/* ---- hotbar -------------------------------------------------------------- */
#hotbar-wrap {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
}
#hotbar {
  display: flex;
  gap: 3px;
  padding: 3px;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: var(--radius);
  backdrop-filter: blur(2px);
}
.slot {
  position: relative;
  width: var(--slot-size);
  height: var(--slot-size);
  background: var(--slot);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
  cursor: pointer;
  transition: background 0.08s, border-color 0.08s;
}
.slot:hover { background: var(--slot-hover); }
.slot .icon {
  width: var(--icon);
  height: var(--icon);
  background-repeat: no-repeat;
  image-rendering: pixelated;
  pointer-events: none;
}
.slot .count {
  position: absolute;
  right: 2px;
  bottom: 0px;
  font: 600 12px/1 var(--font);
  text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
  pointer-events: none;
}
.slot .key {
  position: absolute;
  left: 3px;
  top: 1px;
  font: 500 9px/1 var(--mono);
  color: rgba(255, 255, 255, 0.35);
  pointer-events: none;
}
.slot.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 0 12px rgba(124, 227, 139, 0.35);
}
.slot.damaged::after {
  content: '';
  position: absolute;
  left: 3px;
  right: 3px;
  bottom: 3px;
  height: 2px;
  background: #444;
  border-radius: 1px;
  pointer-events: none;
}
.slot.damaged::before {
  content: '';
  position: absolute;
  left: 3px;
  bottom: 3px;
  height: 2px;
  width: calc((var(--slot-size) - 6px) * var(--durability, 1));
  background: linear-gradient(90deg, #4caf50, #8bc34a);
  border-radius: 1px;
  z-index: 1;
  pointer-events: none;
}
#held-name {
  margin-top: 6px;
  font: 500 13px var(--font);
  text-shadow: 0 1px 3px #000;
  opacity: 0;
  transition: opacity 0.3s;
}
#held-name.show { opacity: 1; }

/* ---- status -------------------------------------------------------------- */
#status-left {
  position: absolute;
  left: 14px;
  bottom: 78px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  align-items: flex-start;
}
.stat-row { display: flex; gap: 2px; }
.heart, .hunger, .shield {
  width: 16px;
  height: 16px;
  background-repeat: no-repeat;
  background-size: contain;
  image-rendering: pixelated;
}
.heart {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 14S1 9.5 1 5.5A3.5 3.5 0 0 1 8 3a3.5 3.5 0 0 1 7 2.5C15 9.5 8 14 8 14z' fill='%23e2564c' stroke='%23341a17' stroke-width='1.2'/></svg>");
}
.heart.half { clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); }
.heart.empty, .hunger.empty, .shield.empty { opacity: 0.25; filter: grayscale(1); }
.hunger {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M4 2v5a2 2 0 0 0 4 0V3' stroke='%23b07a3c' stroke-width='1.6' fill='none'/><path d='M9 2c1 3 3 3 3 6a3 3 0 0 1-6 0V5' fill='%23d99a4a' stroke='%235c3a17' stroke-width='1'/></svg>");
}
.hunger.half { clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); }
.shield {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 1l6 2v6c0 4-3 6-6 6s-6-2-6-6V3z' fill='%23c9d3dd' stroke='%23444' stroke-width='1'/></svg>");
}
#air { margin-top: -2px; }
#air .bubble {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 1.5px solid #9fd8ff;
  background: rgba(120, 200, 255, 0.25);
}
#air .bubble.empty { opacity: 0.2; }

#xp-wrap { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
#xp-bar {
  width: 182px;
  height: 4px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 2px;
  overflow: hidden;
}
#xp-fill { height: 100%; width: 0; background: var(--xp); box-shadow: 0 0 8px var(--xp); transition: width 0.15s; }
#xp-level {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  margin-top: -22px;
  font: 600 13px var(--font);
  color: var(--xp);
  text-shadow: 0 1px 2px #000;
}

/* ---- effects / boss ------------------------------------------------------ */
#status-right { position: absolute; right: 14px; top: 14px; display: flex; flex-direction: column; gap: 4px; }
.effect {
  display: flex; align-items: center; gap: 6px;
  background: rgba(0, 0, 0, 0.42);
  border-radius: 4px;
  padding: 3px 8px 3px 4px;
  font: 500 12px var(--font);
  backdrop-filter: blur(2px);
}
.effect-dot { width: 12px; height: 12px; border-radius: 3px; box-shadow: 0 0 6px currentColor; }
.effect-time { color: var(--text-dim); font-variant-numeric: tabular-nums; }

#boss-bar { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); width: min(420px, 60vw); text-align: center; }
#boss-name { font: 600 13px var(--font); margin-bottom: 3px; text-shadow: 0 1px 2px #000; }
#boss-track { height: 8px; background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.18); }
#boss-fill { height: 100%; width: 50%; background: linear-gradient(90deg, #b34ce0, #e2564c); }

/* ---- chat ---------------------------------------------------------------- */
#chat-wrap { position: absolute; left: 14px; bottom: 120px; width: min(520px, 60vw); pointer-events: none; }
#chat-log { display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; max-height: 40vh; overflow: hidden; }
.chat-msg {
  font: 400 13px/1.35 var(--font);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95);
  background: rgba(0, 0, 0, 0.25);
  padding: 1px 6px;
  border-radius: 3px;
  width: fit-content;
  max-width: 100%;
  word-break: break-word;
  animation: msgIn 0.15s ease-out;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
#chat-input {
  width: 100%;
  margin-top: 6px;
  padding: 5px 8px;
  background: rgba(0, 0, 0, 0.55);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font: 400 13px var(--font);
  opacity: 0;
  pointer-events: none;
}
#chat-input.active { opacity: 1; pointer-events: auto; }
#chat-input::placeholder { color: var(--text-dim); }
#chat-input:focus { outline: none; border-color: var(--accent-dim); }

#subtitle { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); font: 500 14px var(--font); text-shadow: 0 2px 4px #000; }
#toast {
  position: absolute;
  top: 84px;
  left: 50%;
  transform: translateX(-50%) translateY(-10px);
  background: rgba(0, 0, 0, 0.7);
  border: 1px solid var(--border-light);
  border-radius: 6px;
  padding: 6px 14px;
  font: 500 13px var(--font);
  opacity: 0;
  transition: opacity 0.25s, transform 0.25s;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.debug-overlay {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 6px 10px;
  background: rgba(0, 0, 0, 0.55);
  border-radius: 4px;
  font: 500 11px/1.5 var(--mono);
  color: #cfe3ff;
  white-space: pre;
  pointer-events: none;
}

/* ==========================================================================
   Menus / screens
   ========================================================================== */
body.in-menu #glcanvas { filter: blur(2px) brightness(0.65); }
#menu-root { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.screen {
  pointer-events: auto;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 18px 20px;
  min-width: 380px;
  max-width: min(94vw, 900px);
  max-height: 92vh;
  overflow: auto;
  backdrop-filter: blur(8px);
}
.screen-title { font: 600 18px var(--font); margin-bottom: 12px; letter-spacing: 0.02em; }
.screen-body { display: flex; gap: 26px; }
.screen-body.column { flex-direction: column; gap: 10px; }
.screen-col { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.section-title { font: 600 12px var(--font); color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 8px; }

.grid { display: grid; gap: 3px; }
.grid-2x2 { grid-template-columns: repeat(2, var(--slot-size)); }
.grid-2x2 .slot:nth-child(n + 5) { display: none; }
.grid-3x3 { grid-template-columns: repeat(3, var(--slot-size)); }
.grid-player { grid-template-columns: repeat(9, var(--slot-size)); }
.grid-container { grid-template-columns: repeat(9, var(--slot-size)); }
.grid-out { grid-template-columns: var(--slot-size); }
.grid-single { grid-template-columns: var(--slot-size); }
.grid-brewing { grid-template-columns: repeat(3, var(--slot-size)); }
.craft-arrow { font-size: 20px; color: var(--text-dim); margin: 2px 0; }

/* ---- furnace ------------------------------------------------------------- */
.furnace-row { display: flex; align-items: center; gap: 14px; }
.furnace-arrow { width: 60px; height: 10px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden; }
.furnace-progress { height: 100%; width: 0; background: linear-gradient(90deg, #d9a13b, #f2d06b); }
.fire { width: 12px; height: 30px; align-self: flex-end; background: linear-gradient(0deg, #ff6a00, #ffd54a); border-radius: 3px 3px 0 0; align-self: flex-end; }

/* ---- buttons ------------------------------------------------------------- */
.btn {
  appearance: none;
  border: 1px solid var(--border-light);
  background: rgba(255, 255, 255, 0.06);
  color: var(--text);
  padding: 8px 16px;
  border-radius: 6px;
  font: 500 14px var(--font);
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, transform 0.06s;
}
.btn:hover { background: rgba(255, 255, 255, 0.12); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent-dim); border-color: var(--accent); color: #05130a; font-weight: 600; }
.btn.primary:hover { background: var(--accent); }
.menu-buttons { display: flex; flex-direction: column; gap: 8px; width: 260px; }
.menu-hint { margin-top: 14px; font: 400 11px var(--font); color: var(--text-dim); line-height: 1.6; }

/* ---- settings ------------------------------------------------------------ */
.settings { display: flex; flex-direction: column; gap: 10px; min-width: 420px; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.setting-label { font: 500 13px var(--font); }
.setting input[type=range] { width: 200px; accent-color: var(--accent); }
.setting select, .setting input[type=checkbox] { accent-color: var(--accent); }
.setting select { background: var(--panel-solid); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; }

/* ---- enchant / anvil / beacon -------------------------------------------- */
.enchant-row, .anvil-row { display: flex; align-items: center; gap: 10px; }
.enchant-options { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
.enchant-option, .beacon-effect {
  display: flex; justify-content: space-between; align-items: center; gap: 20px;
  padding: 8px 14px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  border-radius: 5px;
  cursor: pointer;
  font: 500 13px var(--mono);
}
.enchant-option:hover, .beacon-effect:hover { background: rgba(124, 227, 139, 0.14); border-color: var(--accent-dim); }
.enchant-option .cost { color: var(--xp); }
.xpdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--xp); box-shadow: 0 0 6px var(--xp); }
.anvil-name, .command-input, .search {
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  padding: 6px 10px;
  font: 400 13px var(--font);
  width: 100%;
}
.command-input { min-height: 90px; font-family: var(--mono); resize: vertical; }
.beacon-effects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

/* ---- recipe book --------------------------------------------------------- */
.recipe-list { width: 100%; max-height: 220px; overflow: auto; border: 1px solid var(--border); border-radius: 5px; padding: 6px; }
.recipe-rows { display: grid; grid-template-columns: 1fr; gap: 2px; }
.recipe-row {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 6px; border-radius: 4px; cursor: pointer; font: 400 12px var(--font);
}
.recipe-row:hover { background: rgba(255, 255, 255, 0.08); }
.row-icon { width: 22px; height: 22px; background-repeat: no-repeat; image-rendering: pixelated; }
.search { margin-bottom: 6px; }
.recipe-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- tooltip / dragged stack --------------------------------------------- */
.tooltip {
  position: fixed;
  z-index: 60;
  background: rgba(12, 16, 22, 0.96);
  border: 1px solid var(--border-light);
  border-radius: 5px;
  padding: 5px 9px;
  font: 500 12px var(--font);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.08s;
  box-shadow: var(--shadow);
  max-width: 260px;
}
.tooltip.show { opacity: 1; }
.tooltip i { color: #b9a6ff; font-style: normal; }
.tooltip .dur { color: var(--text-dim); }
.cursor-stack {
  position: fixed;
  z-index: 70;
  width: var(--icon);
  height: var(--icon);
  background-repeat: no-repeat;
  image-rendering: pixelated;
  pointer-events: none;
  transform: translate(-50%, -50%);
  font: 600 12px/1 var(--font);
  text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
  display: flex; align-items: flex-end; justify-content: flex-end;
  opacity: 0;
}
.cursor-stack.active { opacity: 1; }

/* ---- death / sleep ------------------------------------------------------- */
.death-screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  background: rgba(90, 0, 0, 0.35);
  backdrop-filter: blur(3px);
  pointer-events: auto;
  z-index: 30;
}
.death-title { font: 700 42px var(--font); color: #fff; text-shadow: 0 3px 12px #000; }
.death-msg { font: 500 16px var(--font); color: #ffd9d9; text-shadow: 0 2px 6px #000; }
.death-buttons { display: flex; gap: 12px; }
.sleep-overlay {
  position: absolute; inset: 0;
  background: rgba(10, 14, 30, 0.85);
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12vh;
  pointer-events: auto; z-index: 25;
  font: 600 18px var(--font);
  cursor: pointer;
}

/* ==========================================================================
   Loading
   ========================================================================== */
#loading {
  position: absolute; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  background: radial-gradient(circle at 50% 40%, #16202c, #070a0e 70%);
  transition: opacity 0.5s;
}
#loading.done { opacity: 0; pointer-events: none; }
#loading-logo {
  font: 800 clamp(28px, 7vw, 64px) var(--font);
  letter-spacing: 0.14em;
  background: linear-gradient(180deg, #d9ffe3, #4c9a5c);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 8px 40px rgba(124, 227, 139, 0.25);
}
#loading-bar {
  width: min(420px, 70vw); height: 6px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 3px; overflow: hidden;
}
#loading-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); transition: width 0.25s; }
#loading-text { font: 400 13px var(--font); color: var(--text-dim); text-align: center; max-width: 70vw; }
#loading-text .error { color: var(--danger); font-weight: 600; }

/* ==========================================================================
   Touch controls
   ========================================================================== */
#touch { position: absolute; inset: 0; z-index: 15; pointer-events: none; }
#tstick {
  position: absolute; left: 26px; bottom: 26px;
  width: 130px; height: 130px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.07);
  border: 2px solid rgba(255, 255, 255, 0.18);
  pointer-events: auto;
}
#tstick-knob {
  position: absolute; left: 50%; top: 50%;
  width: 54px; height: 54px; margin: -27px 0 0 -27px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.22);
  border: 2px solid rgba(255, 255, 255, 0.35);
}
#tbtns { position: absolute; right: 22px; bottom: 26px; display: flex; flex-direction: column; gap: 12px; }
.tbtn {
  width: 62px; height: 62px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.25);
  background: rgba(20, 26, 34, 0.55);
  color: var(--text);
  font-size: 22px;
  pointer-events: auto;
  backdrop-filter: blur(3px);
}
.tbtn.down { background: rgba(124, 227, 139, 0.35); }
.touch-device #hotbar { transform: scale(0.85); transform-origin: bottom center; }
.touch-device .slot { width: 46px; height: 46px; }
.touch-device #status-left { bottom: 96px; }

/* ==========================================================================
   Responsive
   ========================================================================== */
@media (max-width: 720px) {
  .screen { min-width: 0; width: 96vw; padding: 12px; }
  .screen-body { flex-direction: column; gap: 12px; }
  :root { --slot-size: 34px; --icon: 28px; }
  .grid-player, .grid-container { grid-template-columns: repeat(9, var(--slot-size)); }
  .settings { min-width: 0; }
  .setting input[type=range] { width: 130px; }
  #chat-wrap { width: 70vw; bottom: 108px; }
}

</style>
</head>
<body>
  <div id="app">
    <canvas id="glcanvas"></canvas>

    <!-- ============================ HUD ============================ -->
    <div id="hud" class="hidden">
      <div id="crosshair"><span class="ch ch-h"></span><span class="ch ch-v"></span></div>

      <div id="hotbar-wrap">
        <div id="hotbar"></div>
        <div id="held-name"></div>
      </div>

      <div id="status-left">
        <div id="hearts" class="stat-row"></div>
        <div id="armor" class="stat-row"></div>
        <div id="hunger" class="stat-row"></div>
        <div id="air" class="stat-row"></div>
        <div id="xp-wrap"><div id="xp-bar"><div id="xp-fill"></div></div><div id="xp-level">0</div></div>
      </div>

      <div id="status-right">

// ---------------------------------------------------------------------------
const BLOCKS = blocks;
const BLOCK_COUNT = blocks.length;
const BLOCK = byName;
const blockId = (name) => {
  const b = byName.get(name);
  return b ? b.id : 0;
};
const getBlock = (id) => blocks[id] || blocks[0];
const blockByName = (name) => byName.get(name) || blocks[0];
const isAir = (id) => id === 0;

const NETHER_BIOMES = [
  B({ id: 100, name: 'nether_wastes', surface: 'netherrack', filler: 'netherrack', height: 0, plants: 0, grassTint: [150, 80, 70], waterTint: [200, 80, 40], mobs: { passive: 0, hostile: 12 } }),

function biomeByName(n) { return BIOMES.find((b) => b.name === n) || NETHER_BIOMES.find((b) => b.name === n) || BIOMES[3]; }

// ===========================================================================
//  generator
// ===========================================================================
class WorldGenerator {
  constructor(seed, dimension = 'overworld', type = 'default') {
    this.seedString = String(seed);
    this.seed = typeof seed === 'number' ? seed : hashString(String(seed));
    this.dimension = dimension;
    this.type = type; // 'default' | 'flat' | 'amplified' | 'void' | 'island' | 'debug'
    const s = this.seed;
    this.nHeight = new Noise(s + 1);
    this.nMountain = new Noise(s + 2);
    this.nErode = new Noise(s + 3);
    this.nTemp = new Noise(s + 4);
    this.nHumid = new Noise(s + 5);
    this.nCave = new Noise(s + 6);
    this.nCave2 = new Noise(s + 7);
    this.nOre = new Noise(s + 8);
    this.nDetail = new Noise(s + 9);
    this.nNether = new Noise(s + 10);
    this.nNether2 = new Noise(s + 11);
    this.height = dimension === 'nether' ? NETHER_HEIGHT : WORLD_HEIGHT;
    this.biomeCache = new Map();
  }

  // -------------------------------------------------------------------------
  heightAt(x, z) {
    if (this.type === 'flat') return 4;
    const amp = this.type === 'amplified' ? 1.9 : 1.0;
    // continent shape
    let cont = this.nHeight.warp2(x * 0.0016, z * 0.0016, 0.55, 4);
    cont = clamp(cont * 1.25, -1, 1);
    // large scale erosion flattens river/valley areas
    const erode = (this.nErode.fbm2(x * 0.004, z * 0.004, 3) * 0.5 + 0.5);
    // mountains where ridged noise is high
    let mnt = this.nMountain.ridged2(x * 0.0035, z * 0.0035, 5);
    mnt = Math.max(0, mnt) * 1.15;
    const mntMask = clamp((cont - 0.05) * 3.2, 0, 1);

    let h = cont * 22 * amp;
    h += mnt * mnt * 62 * amp * mntMask;
    h *= 0.55 + erode * 0.9;
    // small detail
    h += this.nDetail.fbm2(x * 0.03, z * 0.03, 3) * 3.2;
    return SEA_LEVEL + h;
  }

  temperatureAt(x, z) { return this.nTemp.fbm2(x * 0.0011, z * 0.0011, 3) * 0.5 + 0.5; }
  humidityAt(x, z) { return this.nHumid.fbm2(x * 0.0013, z * 0.0013, 3) * 0.5 + 0.5; }

  /** Biome lookup with a cache keyed on a 4-block grid. */
  biomeAt(x, z) {
    if (this.dimension === 'nether') {
      const v = this.nTemp.fbm2(x * 0.004, z * 0.004, 2);
      if (v > 0.28) return NETHER_BIOMES[2];
      if (v < -0.3) return NETHER_BIOMES[1];
      return NETHER_BIOMES[0];
    }
    if (this.type === 'flat') return BIOMES[3];
    const key = ((x >> 2) & 0xffff) * 65536 + ((z >> 2) & 0xffff);
    let b = this.biomeCache.get(key);
    if (b) return b;
    const h = this.heightAt(x, z);
    const t = this.temperatureAt(x, z);
    const hu = this.humidityAt(x, z);
    const er = this.nErode.fbm2(x * 0.004, z * 0.004, 3);
    b = pickBiome(h, t, hu, er);
    if (this.biomeCache.size > 4096) this.biomeCache.clear();
    this.biomeCache.set(key, b);
    return b;
  }

  // -------------------------------------------------------------------------
  isCave(x, y, z, surfaceY) {
    if (y > surfaceY - 2) return false;
    // cheese caves
    const c1 = this.nCave.noise3(x * 0.026, y * 0.045, z * 0.026);
    const c2 = this.nCave2.noise3(x * 0.026, y * 0.045, z * 0.026);
    if (Math.abs(c1) < 0.085 && Math.abs(c2) < 0.085) return true;
    // worm / tunnels
    const w1 = this.nCave.noise3(x * 0.017, y * 0.017, z * 0.017);
    const w2 = this.nCave2.noise3(x * 0.017 + 100, y * 0.017, z * 0.017);
    const dist = Math.hypot(w1, w2);
    if (dist < 0.055) return true;
    // large caverns in the deep
    if (y < 40) {
      const c3 = this.nCave.noise3(x * 0.011, y * 0.022, z * 0.011);
      if (Math.abs(c3) < 0.11 && dist < 0.14) return true;
    }
    return false;
  }

  // =========================================================================
  //  chunk generation entry point
  // =========================================================================
  generateChunk(cx, cz) {
    const sizeX = 16, sizeZ = 16, sizeY = this.height;
    const blocks = new Uint16Array(sizeX * sizeY * sizeZ);
    const meta = new Uint8Array(sizeX * sizeY * sizeZ);
    const heightMap = new Uint16Array(sizeX * sizeZ);
    const out = { blocks, meta, heightMap, cx, cz, tileEntities: [], lights: [] };

    if (this.type === 'void') return out;

    if (this.dimension === 'nether') { this.genNether(out, cx, cz); return out; }
    if (this.type === 'flat') { this.genFlat(out, cx, cz); return out; }

    const idx = (x, y, z) => (y * sizeZ + z) * sizeX + x;
    const ox = cx * 16, oz = cz * 16;
    const AIR = 0;
    const stone = BLOCK.get('stone').id;
    const deepslate = BLOCK.get('deepslate').id;
    const water = BLOCK.get('water').id;
    const bedrock = BLOCK.get('bedrock').id;
    const dirt = BLOCK.get('dirt').id;
    const grass = BLOCK.get('grass_block').id;
    const sand = BLOCK.get('sand').id;
    const sandstone = BLOCK.get('sandstone').id;
    const gravel = BLOCK.get('gravel').id;
    const snowLayer = BLOCK.get('snow_layer').id;
    const lava = BLOCK.get('lava').id;

    // --- terrain columns ---------------------------------------------------
    for (let z = 0; z < 16; z++) {
      for (let x = 0; x < 16; x++) {
        const wx = ox + x, wz = oz + z;
        const biome = this.biomeAt(wx, wz);
        let h = Math.round(this.heightAt(wx, wz));
        // local biome height offset
        h = Math.round(SEA_LEVEL + (h - SEA_LEVEL) * (1 + biome.height) + biome.height * 24);
        h = clamp(h, 6, sizeY - 40);
        // heightMap stores the first empty y (highest non-air block + 1), which
        // is exactly what Chunk.setBlock maintains when the player edits blocks
        heightMap[z * 16 + x] = h + 1;

        let top = biome.surface === 'grass_block' ? grass : (BLOCK.get(biome.surface) || BLOCK.get('grass_block')).id;
        const fillerId = (BLOCK.get(biome.filler) || BLOCK.get('dirt')).id;
        const underwaterId = (BLOCK.get(biome.underwater) || BLOCK.get('gravel')).id;

        for (let y = 0; y <= h; y++) {
          let id = stone;
          if (y === 0 || (y < 5 && this.nDetail.rand3(wx, y, wz) < (5 - y) / 5)) id = bedrock;
          else if (y < 8 && this.nOre.noise3(wx * 0.1, y * 0.1, wz * 0.1) > 0.2) id = deepslate;
          else if (y === h) {
            if (h <= SEA_LEVEL - 1) id = underwaterId;
            else if (h <= SEA_LEVEL + 1) id = (biome.name === 'desert' || biome.name === 'beach') ? sand : underwaterId;
            else id = top;
          } else if (y > h - 4) id = fillerId;
          if (id !== AIR) blocks[idx(x, y, z)] = id;
        }
        // water / lava fill
        if (h < SEA_LEVEL) {
          for (let y = h + 1; y <= SEA_LEVEL; y++) blocks[idx(x, y, z)] = water;
          heightMap[z * 16 + x] = SEA_LEVEL + 1;
        }
        // snow layer on cold biomes
        if (biome.temp <= 0.05 && h > SEA_LEVEL && h < sizeY - 1) {
          blocks[idx(x, h + 1, z)] = snowLayer;
          heightMap[z * 16 + x] = h + 2;
        }
        // caves
        for (let y = 1; y < h; y++) {
          if (blocks[idx(x, y, z)] === 0) continue;
          if (this.isCave(wx, y, wz, h)) {
            blocks[idx(x, y, z)] = 0;
            if (y <= 9) {
              // lava lakes at the bottom of the world
              if (this.nDetail.rand3(wx, y, wz) < 0.35) blocks[idx(x, y, z)] = lava;
            }
          }
        }
      }
    }

    // --- ores --------------------------------------------------------------
    this.placeOres(out, ox, oz, idx);

    // --- features (multi-chunk aware) -------------------------------------
    this.placeFeatures(out, cx, cz, idx);

    return out;
  }

  // -------------------------------------------------------------------------
  genFlat(out, cx, cz) {
    const { blocks, heightMap } = out;
    const idx = (x, y, z) => (y * 16 + z) * 16 + x;
    const layers = [
      [0, 'bedrock'], [1, 'dirt'], [2, 'dirt'], [3, 'grass_block'],
    ];
    for (let z = 0; z < 16; z++) for (let x = 0; x < 16; x++) {
      for (const [y, name] of layers) blocks[idx(x, y, z)] = BLOCK.get(name).id;
      heightMap[z * 16 + x] = 4;
    }
    this.placeFeatures(out, cx, cz, idx);
  }

  // -------------------------------------------------------------------------
  genNether(out, cx, cz) {
    const { blocks, meta, heightMap } = out;
    const sizeY = NETHER_HEIGHT;
    const idx = (x, y, z) => (y * 16 + z) * 16 + x;
    const ox = cx * 16, oz = cz * 16;
    const netherrack = BLOCK.get('netherrack').id;
    const lava = BLOCK.get('lava').id;
    const air = 0;
    const LAVA_LEVEL = 31;

    for (let z = 0; z < 16; z++) {
      for (let x = 0; x < 16; x++) {
        const wx = ox + x, wz = oz + z;
        const biome = this.biomeAt(wx, wz);
        const surf = BLOCK.get(biome.surface).id;
        const fill = BLOCK.get(biome.filler).id;
        // 3D noise cave system: solid where density > 0
        for (let y = 0; y < sizeY; y++) {
          let d = this.nNether.fbm3(wx * 0.017, y * 0.028, wz * 0.017, 4) * 1.4;
          // floor and ceiling are always solid
          if (y < 6) d += (6 - y) * 0.35;
          if (y > sizeY - 12) d += (y - (sizeY - 12)) * 0.35;
          d += (Math.abs(y - 64) - 40) * 0.012;
          if (d > 0.02) {
            let id = netherrack;
            if (y > 110 || y < 8) id = fill;
            else if (d < 0.06) id = surf;
            blocks[idx(x, y, z)] = id;
            heightMap[z * 16 + x] = Math.max(heightMap[z * 16 + x], y + 1);
          } else if (y <= LAVA_LEVEL) {
            blocks[idx(x, y, z)] = lava;
          }
        }
      }
    }
    // nether ores + glowstone
    for (let z = 0; z < 16; z++) for (let x = 0; x < 16; x++) {
      const wx = ox + x, wz = oz + z;
      for (let y = 4; y < sizeY - 6; y++) {
        const i = idx(x, y, z);
        if (blocks[i] !== netherrack) continue;
        const r = this.nOre.rand3(wx, y, wz);
        if (r < 0.012 && y > 20 && y < 100) blocks[i] = BLOCK.get('nether_quartz_ore').id;
        else if (r < 0.018) blocks[i] = BLOCK.get('nether_gold_ore').id;
        else if (r < 0.021) blocks[i] = BLOCK.get('soul_sand').id;
        else if (r < 0.0235) blocks[i] = BLOCK.get('gravel').id;
        else if (r < 0.0245) blocks[i] = BLOCK.get('magma_block').id;
      }
    }
    // glowstone clusters hanging from ceilings
    for (let gx = -1; gx <= 1; gx++) for (let gz = -1; gz <= 1; gz++) {
      const ccx = cx + gx, ccz = cz + gz;
      const r = this.nDetail.rand3(ccx, 77, ccz);
      if (r > 0.22) continue;
      const fx = ccx * 16 + Math.floor(this.nDetail.rand3(ccx, 78, ccz) * 16);
      const fz = ccz * 16 + Math.floor(this.nDetail.rand3(ccx, 79, ccz) * 16);
      const fy = 70 + Math.floor(this.nDetail.rand3(ccx, 80, ccz) * 40);
      this.glowstoneCluster(out, fx - ox, fy, fz - oz);
    }
    return out;
  }

  glowstoneCluster(out, x, y, z) {
    const { blocks } = out;
    const idx = (x, y, z) => (y * 16 + z) * 16 + x;
    const g = BLOCK.get('glowstone').id;
    const n = 12 + Math.floor(this.nDetail.rand3(x, y, z) * 20);
    for (let i = 0; i < n; i++) {
      const a = this.nDetail.rand3(x + i, y, z) * Math.PI * 2;
      const rr = this.nDetail.rand3(x, y + i, z) * 2.4;
      const px = Math.round(x + Math.cos(a) * rr);
      const py = Math.round(y - Math.abs(Math.sin(a)) * rr * 0.7);
      const pz = Math.round(z + Math.sin(a) * rr);
      if (px < 0 || px > 15 || pz < 0 || pz > 15 || py < 4 || py > NETHER_HEIGHT - 4) continue;
      const i2 = idx(px, py, pz);
      if (blocks[i2] === 0) blocks[i2] = g;
    }
  }

  // -------------------------------------------------------------------------
  placeOres(out, ox, oz, idx) {
    const { blocks } = out;
    const ORE_TABLE = [
      // name, minY, maxY, chancePerBlock, veinSize, deepslate variant
      ['coal_ore', 8, 128, 0.0100, 8],
      ['iron_ore', 4, 64, 0.0062, 6],
      ['gold_ore', 4, 32, 0.0016, 5],
      ['diamond_ore', 4, 16, 0.00075, 4],
      ['emerald_ore', 8, 40, 0.00055, 2],
      ['lapis_ore', 8, 36, 0.0018, 5],
      ['redstone_ore', 4, 24, 0.0042, 6],
      ['copper_ore', 16, 96, 0.0055, 7],
    ];
    for (let z = 0; z < 16; z++) {
      for (let x = 0; x < 16; x++) {
        const wx = ox + x, wz = oz + z;
        for (let y = 2; y < 130; y++) {
          const i = idx(x, y, z);
          const cur = blocks[i];
          if (cur !== BLOCK.get('stone').id && cur !== BLOCK.get('deepslate').id) continue;
          for (const [name, minY, maxY, chance, size] of ORE_TABLE) {
            if (y < minY || y > maxY) continue;
            // deterministic: only the "vein origin" rolls
            const ox2 = Math.floor(wx / 3) * 3, oy2 = Math.floor(y / 3) * 3, oz2 = Math.floor(wz / 3) * 3;
            if (this.nOre.rand3(ox2 * 31 + name.length, oy2, oz2 * 17) > chance * 9) continue;
            // walk the vein
            const deep = cur === BLOCK.get('deepslate').id;
            const oreId = BLOCK.get(deep ? 'deepslate_' + name : name).id;
            let px = x, py = y, pz = z;
            const steps = 1 + Math.floor(this.nOre.rand3(wx, y, wz) * size);
            for (let s = 0; s < steps; s++) {
              const dx = Math.round((this.nOre.rand3(px + s * 7, py, pz) - 0.5) * 2);
              const dy = Math.round((this.nOre.rand3(px, py + s * 11, pz) - 0.5) * 2);
              const dz = Math.round((this.nOre.rand3(px, py, pz + s * 13) - 0.5) * 2);
              px = clamp(px + dx, 0, 15); py = clamp(py + dy, 2, 250); pz = clamp(pz + dz, 0, 15);
              const ii = idx(px, py, pz);
              const c2 = blocks[ii];
              if (c2 === BLOCK.get('stone').id || c2 === BLOCK.get('deepslate').id) {
                blocks[ii] = c2 === BLOCK.get('deepslate').id ? BLOCK.get('deepslate_' + name).id : BLOCK.get(name).id;
              }
            }
            break;
          }
        }
      }
    }
  }

  // -------------------------------------------------------------------------
  /**
   * Features are placed from deterministic origins in the 3x3 chunk area and
   * clipped, so every chunk agrees on the shared parts.
   */
  placeFeatures(out, cx, cz, idx) {
    const { blocks, meta } = out;
    const ox = cx * 16, oz = cz * 16;
    const put = (x, y, z, id, m = 0) => {
      if (x < 0 || x > 15 || z < 0 || z > 15 || y < 0 || y >= this.height) return;
      const i = idx(x, y, z);
      if (blocks[i] === 0 || getBlockDef(blocks[i]).replaceable) { blocks[i] = id; meta[i] = m; }
    };
    const set = (x, y, z, id, m = 0) => {
      if (x < 0 || x > 15 || z < 0 || z > 15 || y < 0 || y >= this.height) return;
      const i = idx(x, y, z); blocks[i] = id; meta[i] = m;
    };
    const getAt = (x, y, z) => {
      if (x < 0 || x > 15 || z < 0 || z > 15 || y < 0 || y >= this.height) return 0;
      return blocks[idx(x, y, z)];
    };
    const heightAtLocal = (x, z) => {
      // surface height approximation for feature placement
      const hm = out.heightMap;
      if (x < 0 || x > 15 || z < 0 || z > 15) return SEA_LEVEL;
      return hm[z * 16 + x];
    };

    for (let dz = -1; dz <= 1; dz++) {
      for (let dx = -1; dx <= 1; dx++) {
        const ccx = cx + dx, ccz = cz + dz;
        const fx0 = ccx * 16, fz0 = ccz * 16;
        const rng = makeRng((ccx * 73856093) ^ (ccz * 19349663) ^ this.seed);

        // ---- trees --------------------------------------------------------
        const biomeCenter = this.biomeAt(fx0 + 8, fz0 + 8);
        if (biomeCenter.trees) {
          const count = Math.max(1, Math.round(biomeCenter.trees.density * 256));
          for (let t = 0; t < count; t++) {
            const tx = fx0 + rng.int(16), tz = fz0 + rng.int(16);
            const lx = tx - ox, lz = tz - oz;
            if (lx < -3 || lx > 18 || lz < -3 || lz > 18) continue;
            let ty = heightAtLocal(clamp(lx, 0, 15), clamp(lz, 0, 15));
            if (ty <= SEA_LEVEL || ty > this.height - 30) continue;
            const ground = getAt(clamp(lx, 0, 15), ty, clamp(lz, 0, 15));
            const groundName = ground ? getBlockDef(ground).name : '';
            if (groundName !== 'grass_block' && groundName !== 'dirt' && groundName !== 'podzol' && groundName !== 'snow_block') continue;
            this.placeTree(out, lx, ty, lz, biomeCenter.trees.type, makeRng((tx * 374761393) ^ (tz * 668265263) ^ this.seed), put, set);
          }
        }

        // ---- plants -------------------------------------------------------
        const plantCount = Math.round(biomeCenter.plants * 220);
        for (let p = 0; p < plantCount; p++) {
          const px = fx0 + rng.int(16), pz = fz0 + rng.int(16);
          const lx = px - ox, lz = pz - oz;
          if (lx < 0 || lx > 15 || lz < 0 || lz > 15) continue;
          const py = heightAtLocal(lx, lz);
          if (py <= SEA_LEVEL) continue;
          const below = getAt(lx, py, lz);
          if (!below || getBlockDef(below).name !== 'grass_block') continue;
          const r = rng();
          if (r < biomeCenter.flowers) {
            const flowers = ['dandelion', 'poppy', 'blue_orchid', 'allium', 'azure_bluet', 'red_tulip', 'orange_tulip', 'white_tulip', 'pink_tulip', 'oxeye_daisy', 'cornflower', 'lily_of_the_valley'];

const PASSIVE_MOBS = Object.keys(MOB_DEFS).filter((k) => MOB_DEFS[k].passive);
const HOSTILE_MOBS = Object.keys(MOB_DEFS).filter((k) => MOB_DEFS[k].hostile);

// ---------------------------------------------------------------------------
//  mob
// ---------------------------------------------------------------------------
class Mob extends Entity {
  constructor(world, type, x, y, z) {
    const def = MOB_DEFS[type] || MOB_DEFS.pig;
    super(world, x, y, z, {
      type: 'mob', width: def.width, height: def.height, health: def.health,
      waterMob: def.waterMob, noAir: def.noAir,
    });
    this.mobType = type;
    this.def = def;
    this.name = type;
    this.stepHeight = def.stepHeight ?? 1.0;
    this.gravity = def.flying ? 0 : 32;
    this.speed = def.speed;
    this.hostile = !!def.hostile;
    this.neutral = !!def.neutral;
    this.state = 'idle';
    this.target = null;         // entity being chased / fled
    this.wanderTarget = null;
    this.wanderTimer = 0;
    this.attackCooldown = 0;
    this.loveTimer = 0;
    this.angryTimer = 0;
    this.panicTimer = 0;
    this.baby = false;
    this.babyAge = 0;
    this.walkPhase = Math.random() * 6.28;
    this.headYaw = 0;
    this.headPitch = 0;
    this.attackAnim = 0;
    this.jumpTimer = 0;
    this.lifeTime = 0;
    this.persistent = false;
    this.breedCooldown = 0;
    this.size = def.sizeVar ? 1 + Math.floor(Math.random() * def.sizeVar) : 1;
    this.width *= this.size > 1 ? this.size * 0.8 : 1;
    this.height *= this.size > 1 ? this.size * 0.8 : 1;
    this.tamed = false;
    this.owner = null;
    this.sheared = false;
    this.fuse = -1;
    this.rng = makeRng((x * 31 + z * 17 + (world.time | 0)) | 0);
    if (def.boss) { this.persistent = true; this.boss = true; }
  }

  get displayName() { return this.def.label || this.mobType.replace('_', ' '); }

  // -------------------------------------------------------------------------
  update(dt) {
    if (this.removed) return;
    this.lifeTime += dt;
    if (this.def.flying) {
      // flyers are not affected by gravity; keep them aloft
      this.vel[1] *= 0.92;
      if (this.pos[1] < this.targetY) this.vel[1] += 12 * dt;
    }
    this.ai(dt);
    super.update(dt);
    this.walkPhase += Math.hypot(this.vel[0], this.vel[2]) * dt * 6;
    if (this.attackCooldown > 0) this.attackCooldown -= dt;
    if (this.attackAnim > 0) this.attackAnim -= dt;
    if (this.loveTimer > 0) this.loveTimer -= dt;
    if (this.panicTimer > 0) this.panicTimer -= dt;
    if (this.breedCooldown > 0) this.breedCooldown -= dt;
    if (this.baby) { this.babyAge += dt; if (this.babyAge > 1200) { this.baby = false; } }
    if (this.fuse > 0) {
      this.fuse -= dt;
      if (this.fuse <= 0) this.explode();
    }
    // burning in daylight
    if (this.def.burnsInDay && !this.world.dimensionIsNether && this.isInDaylight()) {
      this.fireTicks = Math.max(this.fireTicks, 40);
    }
    // suffocation check
    if (this.age > 1 && this.world.isOpaque(Math.floor(this.pos[0]), Math.floor(this.pos[1] + this.height * 0.5), Math.floor(this.pos[2]))) {
      this.hurt(1, 'suffocate');
    }
    // despawn
    if (!this.persistent && this.lifeTime > 30 && this.nearestPlayerDist() > 96) {
      if (Math.random() < dt * 0.02) this.remove();
    }
  }

  isInDaylight() {
    const w = this.world;
    if (w.dimension === 'nether') return false;
    const x = Math.floor(this.pos[0]), z = Math.floor(this.pos[2]);
    const top = w.topY(x, z);
    if (top === null || this.pos[1] + this.height < top - 1) return false;
    const t = w.dayTime % 24000;
    return t > 1000 && t < 11500;
  }

  nearestPlayerDist() {
    let best = Infinity;
    for (const p of this.world.players || []) best = Math.min(best, this.distanceTo(p));
    return best;
  }

  nearestPlayer(range = 16) {
    let best = null, bd = range;
    for (const p of this.world.players || []) {
      if (p.dead || p.gamemode === 'spectator') continue;
      const d = this.distanceTo(p);
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  }

  // -------------------------------------------------------------------------
  ai(dt) {
    const def = this.def;
    this.jumpTimer -= dt;
    // panic overrides everything
    if (this.panicTimer > 0) { this.flee(this.lastAttacker || this.nearestPlayer(24), dt); return; }
    if (this.loveTimer > 0) { this.findMate(dt); return; }

    if (this.hostile || (this.neutral && this.angryTimer > 0)) {
      const p = this.target && !this.target.dead ? this.target : this.nearestPlayer(this.neutral ? 24 : 20);
      if (this.neutral && !this.target) {
        // neutral mobs only aggro when attacked or looked at (enderman)
      } else this.target = p;
      if (this.target) {
        const d = this.distanceTo(this.target);
        if (this.def.ranged && d > 4 && d < 24) {
          this.moveTo(this.target.pos, dt, this.speed * 0.7);
          this.rangedAttack(this.target, dt);
        } else if (d < 2.6 && this.attackCooldown <= 0) {
          this.meleeAttack(this.target);
        } else if (d < 32) {
          this.moveTo(this.target.pos, dt, this.speed * (this.hostile ? 1.25 : 1.0));
        }
        if (this.def.explosive && d < 3.2 && this.fuse < 0) this.fuse = 1.5;
        else if (this.def.explosive && d > 6 && this.fuse > 0) this.fuse = -1;
        return;
      }
    }
    if (this.def.protective) {
      // iron golem attacks nearby hostiles
      let best = null, bd = 12;
      for (const e of this.world.entities || []) {
        if (e === this || e.dead || !e.hostile) continue;
        const d = this.distanceTo(e);
        if (d < bd) { bd = d; best = e; }
      }
      if (best) {
        if (bd < 2.8 && this.attackCooldown <= 0) this.meleeAttack(best);
        else this.moveTo(best.pos, dt, this.speed * 1.2);
        return;
      }
    }
    // tamed wolves follow & defend
    if (this.tamed && this.owner) {
      const d = this.distanceTo(this.owner);
      if (d > 6) { this.moveTo(this.owner.pos, dt, this.speed * 1.3); return; }
    }
    // follow a player holding a tempting item
    if (def.follow) {
      const p = this.nearestPlayer(12);
      if (p && this.holdsTemptation(p)) {
        this.moveTo(p.pos, dt, this.speed * 0.9);
        this.lookAt(p.pos[0], p.pos[1], p.pos[2]);
        return;
      }
    }
    this.wander(dt);
  }

  holdsTemptation(player) {
    const want = this.def.follow;
    const held = player.inventory ? player.inventory.getHeld() : null;
    return held && held.name === want;
  }

  wander(dt) {
    this.wanderTimer -= dt;
    if (this.wanderTimer <= 0 || !this.wanderTarget) {
      this.wanderTimer = 2 + this.rng() * 5;
      const a = this.rng() * Math.PI * 2;
      const r = 3 + this.rng() * 8;
      this.wanderTarget = [this.pos[0] + Math.cos(a) * r, this.pos[1], this.pos[2] + Math.sin(a) * r];
    }
    if (this.rng() < dt * 0.15) {
      this.moveTo(this.wanderTarget, dt, this.speed * 0.45);
    } else {
      this.vel[0] *= 0.85; this.vel[2] *= 0.85;
    }
  }

  flee(from, dt) {
    if (!from) { this.wander(dt); return; }
    const dx = this.pos[0] - from.pos[0], dz = this.pos[2] - from.pos[2];
    const l = Math.hypot(dx, dz) || 1;
    this.moveTowards(dx / l, dz / l, dt, this.speed * 1.6);
  }

  findMate(dt) {
    let best = null, bd = 12;
    for (const e of this.world.entities || []) {
      if (e === this || e.removed || e.mobType !== this.mobType || e.loveTimer <= 0) continue;
      const d = this.distanceTo(e);
      if (d < bd) { bd = d; best = e; }
    }
    if (best) {
      if (bd < 1.6) {
        if (this.breedCooldown <= 0 && best.breedCooldown <= 0) {
          this.breedCooldown = 60; best.breedCooldown = 60;
          this.loveTimer = 0; best.loveTimer = 0;
          if (this.onBreed) this.onBreed(this, best);
        }
      } else this.moveTo(best.pos, dt, this.speed);
    } else this.wander(dt);
  }

  /** Steer towards a point with simple obstacle handling. */
  moveTo(target, dt, speed) {
    const dx = target[0] - this.pos[0], dz = target[2] - this.pos[2];
    const l = Math.hypot(dx, dz);
    if (l < 0.6) { this.vel[0] *= 0.7; this.vel[2] *= 0.7; return; }
    this.moveTowards(dx / l, dz / l, dt, speed);
    this.headYaw = Math.atan2(-dx, -dz);
  }

  moveTowards(dirX, dirZ, dt, speed) {
    const s = speed * (this.baby ? 1.3 : 1) * (this.inWater ? 0.6 : 1);
    this.vel[0] += (dirX * s - this.vel[0]) * Math.min(1, dt * 8);
    this.vel[2] += (dirZ * s - this.vel[2]) * Math.min(1, dt * 8);
    this.yaw = Math.atan2(-dirX, -dirZ);
    // hop over obstacles
    if ((this.onGround || this.inWater) && (this.onWall || this.blockedAhead(dirX, dirZ)) && this.jumpTimer <= 0) {
      if (this.inWater) this.vel[1] = 4.5;
      else this.vel[1] = 8.4;
      this.jumpTimer = 0.45;
    }
    if (this.def.flying) {
      const ty = (this.targetY || (this.target ? this.target.pos[1] + 3 : this.pos[1] + 2));
      this.vel[1] += ((ty > this.pos[1] ? 4 : -2) - this.vel[1]) * dt * 2;
    }
  }

  blockedAhead(dx, dz) {
    const x = this.pos[0] + dx * (this.width / 2 + 0.3);
    const z = this.pos[2] + dz * (this.width / 2 + 0.3);
    const y = this.pos[1] + 0.1;
    return this.world.isSolid(Math.floor(x), Math.floor(y), Math.floor(z));
  }

  meleeAttack(target) {
    this.attackCooldown = 1.0;
    this.attackAnim = 0.35;
    const dmg = (this.def.damage || 2) * (this.baby ? 0.5 : 1);
    if (target.hurt(dmg, 'mob', this)) {
      if (this.def.poisonous && target.addEffect) target.addEffect('poison', 140, 0);
    }
    if (this.onAttack) this.onAttack(this, target);
  }

  rangedAttack(target, dt) {
    this.attackCooldown -= dt;
    if (this.attackCooldown > 0) return;
    this.attackCooldown = this.def.ranged === 'arrow' ? 1.6 : 2.5;
    this.attackAnim = 0.3;
    if (this.onRangedAttack) this.onRangedAttack(this, target);
  }

  explode() {
    const r = this.def.explosive || 3;
    if (this.onExplode) this.onExplode(this, r);
    this.remove();
  }

  hurt(amount, source, from) {
    const res = super.hurt(amount, source, from);
    if (res && amount > 0) {
      this.panicTimer = this.hostile ? 0 : 5;
      this.lastAttacker = from;
      if (this.neutral) { this.angryTimer = 30; this.target = from; }
      if (this.tamed && this.owner && from !== this.owner) this.target = from;
      if (this.def.hostileWhenAttacked) { this.target = from; this.angryTimer = 20; }
    }
    return res;
  }

  die(source, from) {
    super.die(source, from);
    if (this.onMobDeath) this.onMobDeath(this, source, from);
  }

  // -------------------------------------------------------------------------
  /** Build the animated cuboid list for the entity renderer. */
  buildParts(renderer, dt) {
    const def = this.def;
    const parts = [];
    const scale = this.baby ? 0.55 : 1;
    const light = this.world.getLight(Math.floor(this.pos[0]), Math.floor(this.pos[1] + 1), Math.floor(this.pos[2]));
    const bl = (light >> 4) & 15, sl = light & 15;
    const walk = Math.sin(this.walkPhase * 2) * Math.min(1, Math.hypot(this.vel[0], this.vel[2]) / 2);
    const idle = Math.sin(this.age * 1.6) * 0.03;
    const col = def.color;
    const shade = (f) => [Math.min(255, col[0] * f) | 0, Math.min(255, col[1] * f) | 0, Math.min(255, col[2] * f) | 0, 255];
    const faceTex = def.face ? renderer.textures.blockMap.get(def.face) : null;
    const pos = this.pos;
    const yaw = this.bodyYaw || this.yaw;
    const P = (px, py, pz, size, color, opt = {}) => parts.push(Object.assign({
      pos: [pos[0] + px, pos[1] + py, pos[2] + pz], size, rot: [yaw, 0, 0], pivot: [0, 0, 0],
      color, light: [bl, sl], tex: null,
    }, opt));

    switch (def.model) {
      case 'quadruped':
      case 'quadruped_wool': {
        const bodyH = 0.55 * scale, bodyW = 0.62 * scale, bodyL = 0.9 * scale;
        const legH = (this.height * 0.45) * scale;
        P(0, legH, 0, [bodyW, bodyH, bodyL], shade(1));
        // head
        const hy = legH + bodyH * 0.9;
        P(0, hy, -bodyL / 2 - 0.12 * scale, [0.45 * scale, 0.45 * scale, 0.42 * scale], shade(1.05), {
          rot: [yaw + this.headYaw * 0.5, this.headPitch, 0], pivot: [0, 0, 0.2 * scale],
        });
        if (faceTex) {
          const fx = Math.sin(yaw + this.headYaw * 0.5), fz = Math.cos(yaw + this.headYaw * 0.5);
          P(fx * 0.24 * scale, hy + 0.05 * scale, -bodyL / 2 - 0.12 * scale - fz * 0.24 * scale,
            [0.34 * scale, 0.32 * scale, 0.02], [255, 255, 255, 255],
            { rot: [yaw + this.headYaw * 0.5, 0, 0], tex: faceTex });
        }
        // legs
        const lp = [[0.22, 0.3], [-0.22, 0.3], [0.22, -0.3], [-0.22, -0.3]];
        for (let i = 0; i < 4; i++) {
          const [ox, oz] = lp[i];
          const ph = (i === 0 || i === 3) ? walk : -walk;
          P(ox * scale, legH, oz * scale, [0.2 * scale, legH, 0.2 * scale], shade(0.8), {
            rot: [yaw, ph, 0], pivot: [0, legH, 0],
          });
        }
        break;
      }
      case 'bird': {
        const bodyH = this.height * 0.55, legH = this.height * 0.3;
        P(0, legH, 0, [0.4 * scale, bodyH * scale, 0.5 * scale], shade(1));
        const hy = legH + bodyH * 0.85;
        P(0, hy, -0.2 * scale, [0.28 * scale, 0.3 * scale, 0.28 * scale], shade(1.1), { rot: [yaw + this.headYaw * 0.6, this.headPitch, 0] });
        if (faceTex) {
          const fx = Math.sin(yaw), fz = Math.cos(yaw);
          P(fx * 0.16 * scale, hy, -0.2 * scale - fz * 0.16 * scale, [0.22 * scale, 0.22 * scale, 0.02], [255, 255, 255, 255], { rot: [yaw, 0, 0], tex: faceTex });
        }
        // wings
        for (const s2 of [1, -1]) {
          P(s2 * 0.24 * scale, legH + bodyH * 0.55, 0, [0.06, bodyH * 0.8 * scale, 0.45 * scale], shade(0.9), {
            rot: [yaw, 0, s2 * (0.2 + (this.def.flying ? Math.sin(this.age * 12) * 0.7 : 0))], pivot: [0, bodyH * 0.4, 0],
          });
        }
        for (const s2 of [1, -1]) {
          P(s2 * 0.1 * scale, legH, 0, [0.08, legH, 0.08], [230, 190, 90], { rot: [yaw, walk * s2, 0], pivot: [0, legH, 0] });
        }
        break;
      }
